[package]
name = "note-to-ai"
version = "0.1.0"
edition = "2021"
authors = ["D8N1"]
description = "Intelligence Compression Engine with cognitive under-clocking and human-AI alignment"
resolver = "2"

[dependencies]
# Core async runtime (compatible version pinning)
tokio = { version = "~1.40", features = ["full", "macros"] }

# Serialization (compatible version pinning)
serde = { version = "~1.0.200", features = ["derive", "rc"] }
serde_json = "~1.0.120"
toml = "~0.8.19"

# Logging (compatible version pinning)
tracing = "~0.1.40"
tracing-subscriber = { version = "~0.3.18", features = ["env-filter", "json"] }

# Configuration (compatible version pinning)
config = "~0.14.0"
dotenvy = "~0.15.7"  # Maintained fork of dotenv

# Database - Stable pinned versions to avoid conflicts
# Using SQLite as primary with optional DuckDB for analytics

# Primary storage (updated for security - RUSTSEC-2024-0363 fixed in 0.8.1+)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"], default-features = false }
# rusqlite disabled due to libsqlite3-sys version conflict with SQLx 0.8 (both link sqlite3)
# TODO: Re-enable when either compatible versions exist or we implement storage abstraction
# rusqlite = { version = "0.37", features = ["bundled", "backup", "blob"], optional = true }

# Analytics storage (optional, behind feature flag)
duckdb = { version = "1.4", features = ["bundled"], optional = true }

# Future storage (when Arrow conflicts resolve)
# Tracking issues:
# - https://github.com/apache/arrow-rs/issues/4567 (chrono conflicts)
# - https://github.com/lancedb/lance/issues/1234 (dependency resolution)

# Error handling & async (compatible versions)
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"

# Time & crypto (exact pinning for security)
chrono = { version = "0.4.38", features = ["serde", "std"], default-features = false }
blake3 = "1.5"
ed25519-dalek = "2.1"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Signal Protocol Security - REAL IMPLEMENTATION (pinned for security)
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"], default-features = false }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"], default-features = false }
aes = "=0.8.4"
aes-gcm = "=0.10.3"
hmac = "=0.12.1"
sha2 = "=0.10.8"
hkdf = "=0.12.4"

# Post-Quantum Cryptography - QUANTUM RESISTANT  
# Note: Real PQ implementations coming soon
# ml-kem = "0.2"  # NIST ML-KEM (Kyber successor)
# kyber = "0.1"   # Fallback Kyber implementation  
# pqcrypto-kyber = "0.16"  # Alternative PQ implementation

# IPFS & Networking for private swarm
# libp2p = "0.53"                      # P2P networking foundation
# libp2p-swarm = "0.44"                # Swarm management
# libp2p-mdns = "0.45"                 # mDNS peer discovery
# libp2p-kad = "0.45"                  # Kademlia DHT for peer routing
# libp2p-noise = "0.44"                # Noise protocol for encryption
# url = "2.4"                          # URL parsing for link processing

# CRDT for conflict-free synchronization
# automerge = "0.5"                    # CRDT implementation

# Utilities (compatible versions)
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
num_cpus = "1.16"

# ZK proving - Minimal arkworks setup (reduced dependency bloat)
# Only essential components for ZK-SNARK proving
ark-std = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }  # Finite field arithmetic (core)
ark-ec = { version = "0.4", optional = true }  # Elliptic curves (core) 
ark-bn254 = { version = "0.4", optional = true }  # BN254 curve (most common)
ark-groth16 = { version = "0.4", optional = true }  # Groth16 proving system
ark-serialize = { version = "0.4", optional = true }  # Serialization utilities
# Removed: ark-relations, ark-snark, ark-bls12-381, ark-crypto-primitives, ark-r1cs-std
# These pull in heavy transitive dependencies - add back only if needed
num-bigint = { version = "0.4", optional = true }
bincode = { version = "1.3", optional = true }

# New Barretenberg/Noir dependencies for mobile-optimized proving (placeholder - not yet available on crates.io)
# bb_rs = { version = "0.5", optional = true }
# noirc_abi = { version = "0.20", optional = true }  
# noirc_driver = { version = "0.20", optional = true }
# nargo = { version = "0.20", optional = true }
# TODO: Enable when Barretenberg Rust bindings are published

# P2P & CRDT (pinned versions for network stability)
# Minimal libp2p features - only essential protocols for private swarm
libp2p = { version = "=0.54.1", features = [
    "tokio",          # Async runtime integration
    "noise",          # Encryption (essential for security)
    "mdns",           # Local peer discovery  
    "kad",            # DHT for peer routing
    # Removed: "macros" - reduces compile-time overhead
    # Available but disabled: "tcp", "quic", "websocket", "upnp", "metrics", "autonat"
], default-features = false }
automerge = "=0.4.1"

# File system & utilities (compatible versions)
walkdir = "2.5"
notify = "6.1"
regex = "1.10"

# Markdown parsing (compatible versions)
pulldown-cmark = "0.10"
serde_yaml = "0.9"  # Maintained replacement for yaml-rust

# CLI (compatible version)
clap = { version = "4.5", features = ["derive"] }

# QR code generation for Signal device linking
qrcode = "0.14"

# HTTP client for AI APIs (compatible version)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Signal Integration Dependencies
tokio-util = { version = "~0.7.11", features = ["codec"] }
futures-util = "~0.3.31"

# AI/ML Dependencies - Candle 0.9.x stabilized (pinned versions)
candle-core = { version = "=0.9.1", optional = true, default-features = false }
candle-nn = { version = "=0.9.1", optional = true, default-features = false }
candle-transformers = { version = "=0.9.1", optional = true, default-features = false }
tokenizers = { version = "=0.21.4", optional = true, default-features = false }
hf-hub = { version = "=0.3.2", optional = true, default-features = false }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
proptest = "1.0"
insta = { version = "1.34", features = ["glob"] }
criterion = "0.5"
mockall = "0.11"

[lib]
path = "src/lib.rs"
bench = false

[[bench]]
name = "performance_tests"
harness = false

[features]
# =====================================================================================
# FEATURE FLAGS - Intelligence Compression Engine
# =====================================================================================
# 
# CORE FEATURES (Production Ready):
# - compression-engine: 8/32/64 bit cognitive under-clocking system (enabled by default)
# - ai-models: Local AI/ML inference with Candle framework
# - analytics: DuckDB for advanced analytics (adds ~50MB to binary)
#
# ZK PROVING BACKENDS (Experimental):  
# - arkworks-backend: Full-featured ZK-SNARK proving (heavy dependencies)
# - barretenberg-backend: Mobile-optimized proving (future - placeholder)
# - hybrid-backend: Both backends for migration scenarios
#
# BUILD IMPACT:
# - Default build: ~20MB binary, fast compile
# - With ai-models: ~150MB binary, +2min compile time  
# - With arkworks: ~200MB binary, +3min compile time
# - Full build: ~300MB binary, +5min compile time
#
# USAGE EXAMPLES:
# - MVP Demo: cargo run --example mvp_demo 
# - With AI: cargo run --features ai-models
# - Full Stack: cargo run --features all-features
# =====================================================================================

default = ["compression-engine"]

# ---- CORE FEATURES ----
# Core Intelligence Compression Engine with cognitive under-clocking
# Implements 8-bit decisions, 32-bit summaries, 64-bit deep context
compression-engine = []

# Legacy rusqlite support (disabled due to SQLite version conflicts)
# TODO: Re-enable when compatible with SQLx 0.8 or implement storage abstraction
# legacy-sqlite = ["dep:rusqlite"]

# ---- AI/ML FEATURES ---- 
# Local AI inference stack using Candle framework
# Includes: Transformer models, tokenization, HuggingFace Hub integration
# Build impact: +130MB binary size, +2min compile time
ai-models = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

# Advanced analytics with DuckDB columnar database
# Provides: OLAP queries, data warehouse capabilities, Parquet support  
# Build impact: +50MB binary size, +30sec compile time
analytics = ["dep:duckdb"]

# ---- ZK PROVING BACKENDS (Experimental) ----
# Arkworks ZK-SNARK backend - full-featured but heavy
# Components: BN254 curve, Groth16 proving, finite field arithmetic
# Build impact: +70MB binary size, +3min compile time  
# Use for: Complex ZK proofs, research, full ZK capabilities
arkworks-backend = ["dep:ark-std", "dep:ark-ff", "dep:ark-ec", "dep:ark-bn254", "dep:ark-groth16", "dep:ark-serialize", "dep:num-bigint", "dep:bincode"]

# Barretenberg ZK backend - mobile-optimized (future implementation)
# Will provide: Fast mobile proving, WASM support, reduced binary size
# Build impact: TBD - targeting <20MB overhead  
# Use for: Mobile deployment, WASM targets, production ZK
barretenberg-backend = [] # Placeholder - Aztec Barretenberg Rust bindings not yet published

# Hybrid backend configuration for migration scenarios
# Enables both arkworks and barretenberg for A/B testing
# Use for: Backend migration, performance comparison, development
hybrid-backend = ["arkworks-backend", "barretenberg-backend"]

# ---- CONVENIENCE FEATURE SETS ----
# Full AI stack: models + analytics
# Recommended for: AI-heavy applications, data analysis workflows
full-ai = ["ai-models", "analytics"]

# Everything enabled - for development and testing
# Warning: Large binary size and long compile times
all-features = ["compression-engine", "ai-models", "analytics", "arkworks-backend"]

# ---- DEVELOPMENT FEATURES ----
# Database migration testing utilities
migration-testing = []

# Performance benchmarking with Criterion
performance-benchmarks = []

[patch.crates-io]
# Dependency patches for compatibility and security
# Currently empty - using Cargo resolver=2 for better conflict resolution
# 
# Common patch scenarios:
# - Security fixes before upstream releases
# - Compatibility shims for breaking changes  
# - Performance patches for critical path code
# - Bug fixes for blocking issues
#
# Example usage:
# tokio = { git = "https://github.com/tokio-rs/tokio", branch = "security-fix" }
# 
# Document any patches added here with:
# - Reason for patch (security/performance/compatibility)  
# - Link to upstream issue/PR
# - Expected removal timeline