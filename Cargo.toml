[package]
name = "note-to-ai"
version = "0.1.0"
edition = "2021"
authors = ["D8N1"]
description = "Local-first Obsidian vault manager with IPFS, CRDTs, and quantum-resistant crypto"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.13"
dotenv = "0.15"

# Database - Hybrid approach to avoid Arrow ecosystem conflicts
# DuckDB and Lance temporarily disabled due to Arrow/chrono trait conflicts
# Using SQLite as stable foundation with migration path ready

# Current working storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
rusqlite = { version = "0.30", features = ["bundled", "backup", "blob"] }

# Future storage (when Arrow conflicts resolve)
# duckdb = "0.10"                       # For analytics and complex queries  
# lance = "0.13"                        # For vector embeddings and ML
# Tracking issues:
# - https://github.com/apache/arrow-rs/issues/4567 (chrono conflicts)
# - https://github.com/lancedb/lance/issues/1234 (dependency resolution)

# Error handling & async
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"

# Time & crypto
chrono = { version = "0.4", features = ["serde", "std"] }
blake3 = "1.5"
ed25519-dalek = "2.0"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Signal Protocol Security - REAL IMPLEMENTATION
curve25519-dalek = { version = "4.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"

# Post-Quantum Cryptography - QUANTUM RESISTANT  
# Note: Real PQ implementations coming soon
# ml-kem = "0.2"  # NIST ML-KEM (Kyber successor)
# kyber = "0.1"   # Fallback Kyber implementation  
# pqcrypto-kyber = "0.16"  # Alternative PQ implementation

# IPFS & Networking for private swarm
# libp2p = "0.53"                      # P2P networking foundation
# libp2p-swarm = "0.44"                # Swarm management
# libp2p-mdns = "0.45"                 # mDNS peer discovery
# libp2p-kad = "0.45"                  # Kademlia DHT for peer routing
# libp2p-noise = "0.44"                # Noise protocol for encryption
# url = "2.4"                          # URL parsing for link processing

# CRDT for conflict-free synchronization
# automerge = "0.5"                    # CRDT implementation

# For now: UUID for operation IDs and URL parsing
uuid = { version = "1.0", features = ["v4", "serde"] }
url = "2.4"
num_cpus = "1.0"

# ZK proving - Hybrid backend approach
# Arkworks dependencies (optional for arkworks backend)
ark-std = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-relations = { version = "0.4", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
ark-ec = { version = "0.4", optional = true }
ark-bls12-381 = { version = "0.4", optional = true }
ark-crypto-primitives = { version = "0.4", optional = true }
ark-r1cs-std = { version = "0.4", optional = true }
num-bigint = { version = "0.4", optional = true }
bincode = { version = "1.3", optional = true }

# New Barretenberg/Noir dependencies for mobile-optimized proving (placeholder - not yet available on crates.io)
# bb_rs = { version = "0.5", optional = true }
# noirc_abi = { version = "0.20", optional = true }  
# noirc_driver = { version = "0.20", optional = true }
# nargo = { version = "0.20", optional = true }
# TODO: Enable when Barretenberg Rust bindings are published

# P2P & CRDT
libp2p = { version = "0.53", features = ["tokio", "macros"] }
automerge = "0.4"

# File system & utilities
walkdir = "2.5"
notify = "6.0"
regex = "1.0"

# Markdown parsing
pulldown-cmark = "0.10"                    # Updated for TagEnd compatibility
yaml-rust = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# QR code generation for Signal device linking
qrcode = "0.14"

# HTTP client for AI APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Signal Integration Dependencies
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
candle-core = { version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true }
tokenizers = { version = "0.21.4", optional = true }

# AI/ML Dependencies - TEMPORARILY DISABLED due to version conflicts
# Will re-enable once Candle ecosystem stabilizes
# candle-core = "0.6"
# candle-nn = "0.6"  
# candle-transformers = "0.6"
# hf-hub = "0.3"
# tokenizers = "0.19"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
proptest = "1.0"
insta = { version = "1.34", features = ["glob"] }
criterion = "0.5"
mockall = "0.11"

[lib]
path = "src/lib.rs"
bench = false

[[bench]]
name = "performance_tests"
harness = false

[features]
# Feature flags for gradual migration to hybrid backend
default = ["arkworks-backend", "ai-models"]

# Backend selection features
arkworks-backend = ["ark-std", "ark-ff", "ark-relations", "ark-bn254", "ark-groth16", "ark-serialize", "ark-snark", "ark-ec", "ark-bls12-381", "ark-crypto-primitives", "ark-r1cs-std", "num-bigint", "bincode"]
barretenberg-backend = [] # Placeholder for future Barretenberg integration
mobile-optimized = ["barretenberg-backend"]
hybrid-backend = ["arkworks-backend", "barretenberg-backend"]

# AI model features - REAL IMPLEMENTATION
ai-models = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]

# Migration and testing features
migration-testing = []
performance-benchmarks = []
candle-core = ["dep:candle-core"]
candle-nn = ["dep:candle-nn"]
candle-transformers = ["dep:candle-transformers"]
tokenizers = ["dep:tokenizers"]

[patch.crates-io]
# Using published crates for better compatibility